<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K_idols.</title>
    <link rel="icon" type="image/png" href="./images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<style>


/* Concert Font */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap');


body {
    background-image: url(https://i.pinimg.com/736x/5a/7d/89/5a7d8988ca76ec49ed68a5c205387709.jpg);
    background-repeat: no-repeat;
    background-position: center;
     background-size: cover;
    backdrop-filter: blur(6px);
} 


/* Form Container */
.form-color {
    background: linear-gradient(145deg, #171717, #050505);
    border: 1px solid #8b0000;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
}

/* Title */
h3 {
    color: #ff2020;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 0 10px red;
}

/* Labels */
label {
    color: #ff3333;
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    font-weight: 700;
}

/* LEFT SIDE IMAGE */
.form-image {
    background-image: url(https://i.pinimg.com/736x/2e/47/58/2e47584364760699da64b8f72d9267fa.jpg);
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    min-height: 600px;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/* Shiny Text Boxes */
form .form-control,
form .form-select {
    background: linear-gradient(135deg, #292929, #101010);
    color: white;
    border: 1px solid #650000;
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    box-shadow: 0 0 5px rgba(255,0,0,0.1);
    transition: all 0.3s ease;
}

/* Shining Hover Effect */
form .form-control:hover,
form .form-select:hover {
    border-color: #ff0000;
    box-shadow: 0 0 12px rgba(255,0,0,0.6);
}

/* Glowing Focus */
form .form-control:focus,
form .form-select:focus {
    background: #171717;
    color: white;
    border-color: #ff0000;
    box-shadow: 0 0 8px red, 0 0 18px rgba(255,0,0,0.6),
}

/* Placeholder */
form .form-control::placeholder {
    color: #aaa;
}

/* Input Icons */
.input-group-text {
    background: #190000;
    color: #ff2020;
    border: 1px solid #8b0000;
    box-shadow: 0 0 5px rgba(255,0,0,0.3);
}

/* Register Button */
.btn-colour {
    background: #8b0000;
    color: white;
    border: 1px solid red;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    transition: 0.3s;
}

.btn-colour:hover {
    background: black;
    color: red;
    border-color: red;
    box-shadow: 0 0 15px red;
    transform: scale(1.05);
}

/* Radio and Checkbox */
form input.form-check-input:checked {
    background-color: red;
    border-color: red;
    box-shadow: 0 0 8px red;
}

form input.form-check-input:focus {
    border-color: red;
    box-shadow: 0 0 8px rgba(255,0,0,0.7);
}

/* Dropdown */
.form-select option {
    background: #111;
    color: white;
}

/* Privacy Policy */
.text-primary {
    color: #ff2020 !important;
}

/* Smooth Animation */
.form-control,
.form-select,
.input-group-text,
.btn-colour {
    transition: all 0.3s ease;
}

button{
    background-color: #ff0000;
    color:white
}


</style>
<html>

    <button class="btn btn-colour">
       <a href="./cortis_second.html" style="text-decoration: none; color:white"><i class="bi bi-arrow-90deg-left"></i>Back To</a>
     </button>

    <div class="container-fluid bg-color py-3">
        <div class="form-color col-md-8 mx-auto my-3 rounded-4 shadow-sm">
            <div class="row">
              <div class="col-lg-5 d-block rounded-2 form-image">
              </div>

                <div class="col-lg-7">

                    <h3 class="my-3">CORTIS Concert Registration</h3>

                    <form class="px-3">

                        <!-- Name -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="input-group my-3">
                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <input type="text" class="form-control" placeholder="First Name">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="input-group my-3">
                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <input type="text" class="form-control" placeholder="Last Name">
                                </div>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="input-group my-3">
                            <span class="input-group-text">
                                <i class="bi bi-envelope-at-fill"></i>
                            </span>
                            <div class="form-floating">
                                <input type="email" class="form-control" placeholder="email address">
                                <label class="ps-4">Email Address</label>
                            </div>
                        </div>

                        <!-- Phone Number -->
                        <div class="input-group my-3">
                            <span class="input-group-text">
                                <i class="bi bi-telephone-fill"></i>
                            </span>
                            <div class="form-floating">
                                <input type="tel" class="form-control" placeholder="Phone Number">
                                <label class="ps-4">Phone Number</label>
                            </div>
                        </div>

                        <!-- Ticket Type -->
                        <div class="row">
                            <div class="col-3">
                                <label class="form-label">Ticket Type</label>
                            </div>

                            <div class="col-3 form-check form-switch">
                                <input type="radio" class="form-check-input" name="ticket">
                                <label class="form-check-label">VIP</label>
                            </div>

                            <div class="col-3 form-check form-switch">
                                <input type="radio" class="form-check-input" name="ticket">
                                <label class="form-check-label">General</label>
                            </div>

                            <div class="col-3 form-check form-switch">
                                <input type="radio" class="form-check-input" name="ticket">
                                <label class="form-check-label">Premium</label>
                            </div>
                        </div>

                        <!-- Ticket Selection -->
                        <div class="row my-3">

                            <div class="col-md-6">
                                <label class="form-label">Concert Date</label>
                                <select class="form-select">
                                    <option value="" selected disabled>Select Date</option>
                                    <option>December 20, 2026</option>
                                    <option>December 21, 2026</option>
                                    <option>December 22, 2026</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Number of Tickets</label>
                                <select class="form-select">
                                    <option value="" selected disabled>Select Quantity</option>
                                    <option>1 Ticket</option>
                                    <option>2 Tickets</option>
                                    <option>3 Tickets</option>
                                    <option>4 Tickets</option>
                                </select>
                            </div>

                        </div>

                        <!-- Additional Information -->
                        <div class="my-3">
                            <label class="form-label">Special Requests</label>
                            <textarea class="form-control" rows="3" cols="37" placeholder="Any additional information..."></textarea>
                        </div>

                        <!-- Policy -->
                        <div class="form-check">
                            <input type="checkbox" name="policy" class="form-check-input">
                            <label class="form-check-label">
                                I agree to the <span class="text-primary">Ticket Terms & Conditions</span>
                            </label>
                        </div>

                        <!-- Register Button -->
                        <div class="my-3">
                            <button type="submit" class="btn btn-colour "data-bs-toggle="modal" data-bs-target="#logIn">
                                <i class="bi bi-ticket-perforated-fill"></i>
                                Register Now
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>


     <div class="modal" id="logIn">
        <div class="modal-dialog">
            <div class="modal-content" style="border:2px solid red; background-color: #101010;">
                <div class="modal-header border-0">
                  <button class="btn-close" style="background-color:red" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body border-0 d-flex justify-content-center align-item-center flex-column ">
                  <div class="card " style="border: 2px solid red">
                      <img src="https://i.pinimg.com/736x/9d/e9/8b/9de98bd5d6e57eed527651f7b4e3dfb7.jpg" class="w-100" href="">
                  </div>

                  <div>
                     <h4 class="modal-form" style="font-family: 'Orbitron', sans-serif; color:red; font-weight: 800; letter-spacing: 2px; text-shadow: 0 0 10px red;">REGISTER SUCCESS</h4>
                      <p class="text-white">want to catch up the latest news?</p>
                        <div class="w-100">
                           <button class="btn bt-sm" style="background-color: #ff0000; color:white">Sing up for free</button>
                        </div>
                  </div>
                </div>
            
               <div class="modal-footer border-0 justify-content-center">
                 <p class="text-white">Already have an account? <a class="text-danger" href="https://myaccount.google.com/intro/profile">Log in</a></p>
               </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
